name: Flutter Nightly Build

on:
  # 궁구미 원격: 매일 자동 빌드 끔 — 필요할 때 workflow_dispatch로만 돌림
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
